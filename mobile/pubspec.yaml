name: wow_gift
description: Wow Gift - أهدي بطريقة تُبهر
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^16.3.2
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.3.0
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  flutter_svg: ^2.0.9
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  connectivity_plus: ^5.0.2
  lottie: ^2.7.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
