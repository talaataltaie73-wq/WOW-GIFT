services:
  - type: web
    name: wow-gift-api
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt && \
      cd admin-dashboard && \
      npm install && \
      npm run build && \
      cd ..
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
